[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-control-center"
version = "2.2.0"
description = "A portable control center for customer-scoped Python features."
requires-python = ">=3.13"
dependencies = [
  "Flask==3.1.3",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.2",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "packaging==26.3",
  "croniter==6.2.4",
  "tzdata==2026.3",
  "waitress==3.0.2",
  "py7zr==1.1.3",
  "rarfile==4.5",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "coverage==7.16.0",
]

[project.scripts]
fcc-web = "app.web.server:main"
fcc-runner = "app.runner.main:main"
fcc-scheduler = "app.scheduler.main:main"
fcc-launcher = "app.launcher:main"
fccctl = "app.cli:main"
fcc-update-package = "app.update_tool:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.infrastructure.migrations" = ["script.py.mako"]
"app.web" = ["static/*", "static/assets/*"]
"app" = ["release_history.json", "update_public_key.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
