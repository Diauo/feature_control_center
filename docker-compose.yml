name: feature-control-center

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: feature-control-center:2.2.0
    container_name: feature-control-center
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      # FSETID：目录 setgid 位依赖此能力（系统日志按组共享给 web 用户读取）
      - FSETID
      - KILL
      - SETGID
      - SETUID
    init: true
    pids_limit: 256
    stop_grace_period: 35s
